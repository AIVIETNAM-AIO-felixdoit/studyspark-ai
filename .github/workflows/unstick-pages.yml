name: Cancel stuck Pages deployment
on:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel deployment 118ebdb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -w "\nHTTP %{http_code}\n" -X GET -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/118ebdb9a25c36158a17c2979eea6913aeca784e"
          curl -s -w "\nHTTP %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/118ebdb9a25c36158a17c2979eea6913aeca784e/cancel"
